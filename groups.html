<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Groups — Asia Cup 2026</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav id="main-nav"></nav>
  <div class="page-wrap">

    <div class="section-header" style="margin-bottom:2rem">
      <div class="group-label">G</div>
      <h2>Group Stage</h2>
      <div class="accent-bar"></div>
    </div>

    <div id="groups-container"></div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNav('groups');
    const data = getData();

    function renderGroups() {
      const container = document.getElementById('groups-container');
      const groupKeys = ['A','B','C','D'];
      const hasAnyGroup = groupKeys.some(g => data.groups[g].length > 0);

      if (!hasAnyGroup) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎲</div>
            <h3>Group Draw Pending</h3>
            <p>The group draw hasn't been done yet. Check back after 23rd May 2026.</p>
            <a href="admin.html" class="btn btn-primary" style="margin-top:1rem">Go to Admin</a>
          </div>`;
        return;
      }

      container.innerHTML = groupKeys.map(g => renderGroup(g)).join('');
    }

    function renderGroup(g) {
      const standings = calculateStandings(g, data);
      const matches   = getGroupMatches(g, data);

      if (!standings.length) return '';

      const standingRows = standings.map((s, i) => {
        const team = data.teams[s.teamId];
        const qualifies = i < 2;
        return `
          <tr class="${qualifies ? 'qualify' : ''}">
            <td><span class="rank-badge ${qualifies?'rank-'+(i+1):''}">${i+1}</span></td>
            <td>
              <div style="display:flex;align-items:center;gap:0.6rem;cursor:pointer" onclick="goToTeam('${s.teamId}')">
                ${teamLogoEl(team)}
                <span style="font-weight:700">${team?.name||s.teamId}</span>
              </div>
            </td>
            <td>${s.played}</td>
            <td class="green">${s.won}</td>
            <td class="muted">${s.drawn}</td>
            <td class="red">${s.lost}</td>
            <td>${s.gf}</td>
            <td>${s.ga}</td>
            <td>${s.gd >= 0 ? '+'+s.gd : s.gd}</td>
            <td><span class="pts-badge">${s.points}</span></td>
          </tr>`;
      }).join('');

      const matchRows = matches.length
        ? matches.map(m => renderMatchCard(m, data, 'goToMatch')).join('')
        : '<div class="empty-state" style="padding:1.5rem"><p>Fixtures not yet scheduled</p></div>';

      return `
        <div class="card section-gap">
          <div class="section-header" style="margin-bottom:1.5rem">
            <div class="group-label">G${g}</div>
            <h2>Group ${g}</h2>
            <div class="accent-bar"></div>
            <span class="muted" style="font-size:0.8rem">Top 2 qualify</span>
          </div>

          <!-- Standings table -->
          <div style="overflow-x:auto;margin-bottom:1.5rem">
            <table>
              <thead>
                <tr>
                  <th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th>
                  <th>GF</th><th>GA</th><th>GD</th><th>PTS</th>
                </tr>
              </thead>
              <tbody>${standingRows}</tbody>
            </table>
          </div>

          <!-- Fixtures/Results -->
          <div class="section-header" style="margin-bottom:1rem">
            <h2 style="font-size:1rem">Fixtures & Results</h2>
            <div class="accent-bar"></div>
          </div>
          <div style="display:grid;gap:0.6rem">${matchRows}</div>
        </div>`;
    }

    renderGroups();
  </script>
</body>
</html>
