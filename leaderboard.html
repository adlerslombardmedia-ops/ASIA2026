<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leaderboard — Asia Cup 2026</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .lb-tabs { display:flex;gap:1rem;margin-bottom:1.5rem;flex-wrap:wrap; }
    .lb-card { background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden; }
    .lb-header { display:grid;padding:0.75rem 1rem;background:var(--dark);font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--gold);border-bottom:1px solid var(--border); }
    .lb-row { display:grid;padding:0.8rem 1rem;border-bottom:1px solid var(--border);align-items:center;transition:background 0.15s; }
    .lb-row:last-child { border-bottom:none; }
    .lb-row:hover { background:rgba(255,212,0,0.04); }
    .scorers-cols  { grid-template-columns:40px 1fr 150px 60px 60px 80px; }
    .assists-cols  { grid-template-columns:40px 1fr 150px 60px 60px; }
    .cs-cols       { grid-template-columns:40px 1fr 150px 80px; }
    .lb-num { font-size:1.3rem;font-weight:900;color:var(--gold);text-align:center; }
  </style>
</head>
<body>
  <nav id="main-nav"></nav>
  <div class="page-wrap">

    <div class="section-header" style="margin-bottom:2rem">
      <div class="group-label">📊</div>
      <h2>Leaderboard</h2>
      <div class="accent-bar"></div>
    </div>

    <div class="tabs lb-tabs">
      <button class="tab-btn active" onclick="showTab('scorers',this)">⚽ Top Scorers</button>
      <button class="tab-btn" onclick="showTab('assists',this)">🅰️ Top Assists</button>
      <button class="tab-btn" onclick="showTab('cleansheets',this)">🧤 Clean Sheets</button>
      <button class="tab-btn" onclick="showTab('standings',this)">📋 All Standings</button>
    </div>

    <!-- Top Scorers -->
    <div id="tab-scorers" class="tab-panel active">
      <div class="lb-card">
        <div class="lb-header scorers-cols">
          <span>#</span><span>Player</span><span>Team</span>
          <span style="text-align:center">Goals</span>
          <span style="text-align:center">Assists</span>
          <span style="text-align:center">Contribution</span>
        </div>
        <div id="scorers-list"></div>
      </div>
    </div>

    <!-- Top Assists -->
    <div id="tab-assists" class="tab-panel">
      <div class="lb-card">
        <div class="lb-header assists-cols">
          <span>#</span><span>Player</span><span>Team</span>
          <span style="text-align:center">Assists</span>
          <span style="text-align:center">Goals</span>
        </div>
        <div id="assists-list"></div>
      </div>
    </div>

    <!-- Clean Sheets -->
    <div id="tab-cleansheets" class="tab-panel">
      <div class="lb-card">
        <div class="lb-header cs-cols">
          <span>#</span><span>Goalkeeper</span><span>Team</span>
          <span style="text-align:center">Clean Sheets</span>
        </div>
        <div id="cs-list"></div>
      </div>
    </div>

    <!-- All Group Standings -->
    <div id="tab-standings" class="tab-panel">
      <div id="all-standings"></div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNav('leaderboard');
    const data = getData();

    // Scorers
    const allPlayers = getLeaderboard(data);
    const scorers  = [...allPlayers].sort((a,b) => b.goals-a.goals || b.assists-a.assists);
    const assisters = [...allPlayers].sort((a,b) => b.assists-a.assists || b.goals-a.goals);
    const cleanShts = getCleanSheets(data);

    function rankBadge(i) {
      return `<span class="rank-badge rank-${i+1}">${i+1}</span>`;
    }

    function renderScorers() {
      const el = document.getElementById('scorers-list');
      if (!scorers.filter(p=>p.goals>0).length) {
        el.innerHTML = `<div class="empty-state" style="padding:2rem"><p>No goals scored yet</p></div>`;
        return;
      }
      el.innerHTML = scorers.filter(p=>p.goals>0).map((p,i) => `
        <div class="lb-row scorers-cols">
          ${rankBadge(i)}
          <strong>${p.name}</strong>
          <span class="muted" style="cursor:pointer" onclick="goToTeam('${p.teamId}')">${data.teams[p.teamId]?.shortName||p.teamId}</span>
          <div class="lb-num">${p.goals}</div>
          <div style="text-align:center;color:var(--muted)">${p.assists}</div>
          <div style="text-align:center"><span class="pill" style="background:rgba(255,212,0,0.15);color:var(--gold);border:1px solid var(--gold)">${p.goals+p.assists}</span></div>
        </div>`).join('');
    }

    function renderAssists() {
      const el = document.getElementById('assists-list');
      if (!assisters.filter(p=>p.assists>0).length) {
        el.innerHTML = `<div class="empty-state" style="padding:2rem"><p>No assists recorded yet</p></div>`;
        return;
      }
      el.innerHTML = assisters.filter(p=>p.assists>0).map((p,i) => `
        <div class="lb-row assists-cols">
          ${rankBadge(i)}
          <strong>${p.name}</strong>
          <span class="muted" style="cursor:pointer" onclick="goToTeam('${p.teamId}')">${data.teams[p.teamId]?.shortName||p.teamId}</span>
          <div class="lb-num">${p.assists}</div>
          <div style="text-align:center;color:var(--muted)">${p.goals}</div>
        </div>`).join('');
    }

    function renderCleanSheets() {
      const el = document.getElementById('cs-list');
      if (!cleanShts.length) {
        el.innerHTML = `<div class="empty-state" style="padding:2rem"><p>No clean sheets recorded yet</p></div>`;
        return;
      }
      el.innerHTML = cleanShts.map((p,i) => `
        <div class="lb-row cs-cols">
          ${rankBadge(i)}
          <strong>${p.name}</strong>
          <span class="muted" style="cursor:pointer" onclick="goToTeam('${p.teamId}')">${data.teams[p.teamId]?.shortName||p.teamId}</span>
          <div class="lb-num">${p.cleanSheets}</div>
        </div>`).join('');
    }

    function renderAllStandings() {
      const el = document.getElementById('all-standings');
      el.innerHTML = ['A','B','C','D'].map(g => {
        const st = calculateStandings(g, data);
        if (!st.length) return '';
        return `
          <div class="card" style="margin-bottom:1.5rem">
            <div class="section-header" style="margin-bottom:1rem">
              <div class="group-label">G${g}</div>
              <h2 style="font-size:1.1rem">Group ${g}</h2>
              <div class="accent-bar"></div>
            </div>
            <div style="overflow-x:auto">
              <table>
                <thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>PTS</th></tr></thead>
                <tbody>
                  ${st.map((s,i) => `
                    <tr class="${i<2?'qualify':''}">
                      <td><span class="rank-badge ${i<2?'rank-'+(i+1):''}">${i+1}</span></td>
                      <td style="cursor:pointer" onclick="goToTeam('${s.teamId}')"><strong>${data.teams[s.teamId]?.name||s.teamId}</strong></td>
                      <td>${s.played}</td>
                      <td class="green">${s.won}</td>
                      <td class="muted">${s.drawn}</td>
                      <td class="red">${s.lost}</td>
                      <td>${s.gf}</td>
                      <td>${s.ga}</td>
                      <td>${s.gd>=0?'+'+s.gd:s.gd}</td>
                      <td><span class="pts-badge">${s.points}</span></td>
                    </tr>`).join('')}
                </tbody>
              </table>
            </div>
          </div>`;
      }).join('') || `<div class="empty-state"><div class="icon">📋</div><p>Group draw pending</p></div>`;
    }

    function showTab(name, btn) {
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('tab-'+name).classList.add('active');
      btn.classList.add('active');
    }

    renderScorers();
    renderAssists();
    renderCleanSheets();
    renderAllStandings();
  </script>
</body>
</html>
