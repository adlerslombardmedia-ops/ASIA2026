<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knockout — Asia Cup 2026</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .bracket-wrap {
      overflow-x: auto;
      padding-bottom: 2rem;
    }
    .bracket-tree {
      display: flex;
      gap: 0;
      align-items: stretch;
      min-width: 900px;
    }
    .bracket-col {
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .bracket-col-header {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--gold);
      padding: 0.8rem 0.5rem;
      border-bottom: 2px solid var(--gold);
      margin-bottom: 1rem;
    }
    .bracket-col-matches {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      flex: 1;
      gap: 1rem;
      padding: 0.5rem;
    }
    .bm {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s;
    }
    .bm:hover { border-color: var(--gold); box-shadow: 0 0 12px rgba(255,212,0,0.15); }
    .bm-team {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.55rem 0.8rem;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-weight: 600;
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }
    .bm-team:last-child { border-bottom: none; }
    .bm-team.winner { background: rgba(255,212,0,0.12); font-weight: 800; color: var(--gold); }
    .bm-team .bm-score { font-weight: 900; color: var(--gold); min-width: 16px; text-align: right; }
    .bm-team .bm-tbd { color: var(--muted); font-style: italic; font-size: 0.75rem; }
    .bm-label { font-size: 0.65rem; color: var(--muted); text-align: center; padding: 0.2rem; background: var(--darker); text-transform: uppercase; letter-spacing: 0.5px; }
    .bm-logo { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; flex-shrink: 0; background: var(--card2); display:flex;align-items:center;justify-content:center;font-size:0.55rem;font-weight:900;color:var(--muted); overflow:hidden; }
    .bm-logo img { width:100%;height:100%;object-fit:cover;border-radius:50%; }
    .connector {
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      padding: 0.5rem 0;
      width: 24px;
      flex-shrink: 0;
    }
    .connector svg { width: 24px; }
    .trophy-box {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      padding: 1rem;
      flex-shrink: 0;
    }
    .trophy-icon { font-size: 4rem; }
    .trophy-label { font-size: 0.75rem; font-weight: 800; color: var(--gold); text-transform: uppercase; letter-spacing: 1px; text-align: center; }
    .champion-name { font-size: 1rem; font-weight: 900; color: var(--gold); text-align: center; }
  </style>
</head>
<body>
  <nav id="main-nav"></nav>
  <div class="page-wrap">

    <div class="section-header" style="margin-bottom:2rem">
      <div class="group-label" style="background:var(--red)">🏆</div>
      <h2>Knockout Stage</h2>
      <div class="accent-bar"></div>
    </div>

    <div class="card">
      <div class="bracket-wrap">
        <div class="bracket-tree" id="bracket-tree"></div>
      </div>
    </div>

  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    renderNav('knockout');

    function buildBracket() {
      const data = advanceKnockout(getData());

      function bmTeamHtml(teamId, score, winnerId) {
        const team = data.teams[teamId];
        const isWinner = winnerId && winnerId === teamId;
        if (!teamId) return `<div class="bm-team"><span class="bm-tbd">TBD</span><span class="bm-score">-</span></div>`;
        const logoDiv = team?.logo
          ? `<div class="bm-logo"><img src="${team.logo}" alt=""></div>`
          : `<div class="bm-logo" style="background:${team?.primaryColor||'#333'};color:${team?.secondaryColor||'#fff'}">${(team?.shortName||'??').substring(0,3)}</div>`;
        return `
          <div class="bm-team ${isWinner?'winner':''}">
            <div style="display:flex;align-items:center;gap:0.5rem;min-width:0">
              ${logoDiv}
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${team?.shortName||teamId}</span>
            </div>
            <span class="bm-score">${score !== null && score !== undefined ? score : '-'}</span>
          </div>`;
      }

      function bmHtml(match) {
        return `
          <div class="bm" onclick="goToMatch('${match.id}')">
            <div class="bm-label">${match.label}</div>
            ${bmTeamHtml(match.homeTeam, match.homeScore, match.winner)}
            ${bmTeamHtml(match.awayTeam, match.awayScore, match.winner)}
          </div>`;
      }

      // QF connector SVGs (simple lines)
      function connectorQFtoSF(idx) {
        // pair 0+1 → sf1, pair 2+3 → sf2
        return `<svg height="100%" viewBox="0 0 24 80" xmlns="http://www.w3.org/2000/svg" style="height:80px">
          <line x1="0" y1="20" x2="12" y2="20" stroke="#444" stroke-width="1.5"/>
          <line x1="0" y1="60" x2="12" y2="60" stroke="#444" stroke-width="1.5"/>
          <line x1="12" y1="20" x2="12" y2="60" stroke="#444" stroke-width="1.5"/>
          <line x1="12" y1="40" x2="24" y2="40" stroke="#444" stroke-width="1.5"/>
        </svg>`;
      }

      const qf = data.knockout.QF;
      const sf = data.knockout.SF;
      const f  = data.knockout.F;
      const champion = f[0].winner ? data.teams[f[0].winner] : null;

      document.getElementById('bracket-tree').innerHTML = `
        <!-- QF Column -->
        <div class="bracket-col">
          <div class="bracket-col-header">Quarter-Finals</div>
          <div class="bracket-col-matches">
            ${bmHtml(qf[0])}
            ${bmHtml(qf[1])}
            ${bmHtml(qf[2])}
            ${bmHtml(qf[3])}
          </div>
        </div>

        <!-- QF→SF connectors -->
        <div style="display:flex;flex-direction:column;justify-content:space-around;padding:3.5rem 0 0.5rem;gap:1rem;width:30px;flex-shrink:0">
          <svg viewBox="0 0 30 140" style="height:140px" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="35" x2="15" y2="35" stroke="#555" stroke-width="1.5"/>
            <line x1="0" y1="105" x2="15" y2="105" stroke="#555" stroke-width="1.5"/>
            <line x1="15" y1="35" x2="15" y2="105" stroke="#555" stroke-width="1.5"/>
            <line x1="15" y1="70" x2="30" y2="70" stroke="#555" stroke-width="1.5"/>
          </svg>
          <svg viewBox="0 0 30 140" style="height:140px" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="35" x2="15" y2="35" stroke="#555" stroke-width="1.5"/>
            <line x1="0" y1="105" x2="15" y2="105" stroke="#555" stroke-width="1.5"/>
            <line x1="15" y1="35" x2="15" y2="105" stroke="#555" stroke-width="1.5"/>
            <line x1="15" y1="70" x2="30" y2="70" stroke="#555" stroke-width="1.5"/>
          </svg>
        </div>

        <!-- SF Column -->
        <div class="bracket-col">
          <div class="bracket-col-header">Semi-Finals</div>
          <div class="bracket-col-matches">
            ${bmHtml(sf[0])}
            ${bmHtml(sf[1])}
          </div>
        </div>

        <!-- SF→F connectors -->
        <div style="display:flex;flex-direction:column;justify-content:center;padding:3.5rem 0 0.5rem;width:30px;flex-shrink:0">
          <svg viewBox="0 0 30 200" style="height:200px" xmlns="http://www.w3.org/2000/svg">
            <line x1="0" y1="50" x2="15" y2="50" stroke="#555" stroke-width="1.5"/>
            <line x1="0" y1="150" x2="15" y2="150" stroke="#555" stroke-width="1.5"/>
            <line x1="15" y1="50" x2="15" y2="150" stroke="#555" stroke-width="1.5"/>
            <line x1="15" y1="100" x2="30" y2="100" stroke="#555" stroke-width="1.5"/>
          </svg>
        </div>

        <!-- Final Column -->
        <div class="bracket-col">
          <div class="bracket-col-header">Final</div>
          <div class="bracket-col-matches" style="justify-content:center">
            ${bmHtml(f[0])}
          </div>
        </div>

        <!-- Trophy -->
        <div class="trophy-box">
          <div class="trophy-icon">🏆</div>
          <div class="trophy-label">Champion</div>
          <div class="champion-name">${champion ? champion.name : '???'}</div>
        </div>`;
    }

    buildBracket();
  </script>
</body>
</html>
